return { radius: '12px', bg: sp ? (dark ? 'radial-gradient(circle at 30% 25%, #3A3A3A 0%, #111111 80%)' : 'radial-gradient(circle at 30% 25%, #F0303F 0%, #B80016 85%)') : 'radial-gradient(circle at 30% 25%, #FFFDF4 0%, #EFE6CC 65%, #D9CBA5 100%)', border: 'none', ink: sp ? '#FFFDF4' : '#111111', font: "'Anton', sans-serif", fstyle: 'normal', weight: 400, size: '15px', inner: 'inset 0 0 0 2px rgba(0,0,0,0.1), inset 0 -6px 10px rgba(110,80,20,0.28)', gloss: 0.5 };
},
v: {
pageBg: 'radial-gradient(rgba(0,0,0,0.07) 1px, transparent 1px), #F1EADB', pageBgSize: '4px 4px, auto', ink: '#111111', muted: '#3D3A33', bodyFont: "'Source Serif 4', Georgia, serif",
metaFont: "'IBM Plex Mono', monospace", metaRight: 'EDIZIONE STRAORDINARIA', ruleTop: '3px solid #111111', ruleBottom: '1px solid #111111',
mastFont: "'Anton', sans-serif", mastSize: '19px', mastWeight: 400, mastStyle: 'normal', mastCase: 'uppercase',
accent: '#D0021B', accentInk: '#FFFFFF', headFont: "'Anton', sans-serif", headWeight: 400, headStyle: 'normal', headSize: '42px', headCase: 'uppercase',
trayRadius: '18px', trayBg: 'radial-gradient(circle at 50% 40%, #2E8A5B 0%, #1F6B45 60%, #154B30 100%)', trayBgSize: 'auto', trayShadow: '0 0 0 10px #5A3A22, 0 0 0 13px #2E1C0E, inset 0 0 40px rgba(0,0,0,0.45), 0 30px 40px rgba(0,0,0,0.35)',
btnFont: "'Anton', sans-serif", btnWeight: 400, btnSize: '22px', btnTrack: '0.5px', btnBg: '#D0021B', btnInk: '#FFFFFF', btnBorder: '3px solid #111111', btnRadius: '0px', btnShadow: '5px 5px 0 #111111',
btn2Bg: '#FBF7EC', btn2Ink: '#111111', btn2Border: '3px solid #111111', resultBg: '#111111', resultInk: '#F1EADB'
}
};
}
renderVals() {
const T = this.theme();
const b = this.b;
const R = this.mat();
const f5 = (x) => (Math.round(x * 100000) / 100000);
const m = 'matrix3d(' + [R[0][0], R[1][0], R[2][0], 0, R[0][1], R[1][1], R[2][1], 0, R[0][2], R[1][2], R[2][2], 0, 0, 0, 0, 1].map(f5).join(',') + ')';
const L = [-0.35, -0.45, 0.82];
const faces = this.N.map((n, i) => {
const wn = [R[0][0] * n[0] + R[0][1] * n[1] + R[0][2] * n[2], R[1][0] * n[0] + R[1][1] * n[1] + R[1][2] * n[2], R[2][0] * n[0] + R[2][1] * n[1] + R[2][2] * n[2]];
const lit = Math.max(0, wn[0] * L[0] + wn[1] * L[1] + wn[2] * L[2]);
const o = T.face(i);
o.tf = this.TF[i];
o.label = T.labels[i];
o.shade = Math.round((1 - lit) * T.shadeK * 100) / 100;
return o;
});
const z = Math.max(0, b.p[2] - this.h);
const out = Object.assign({}, T.v);
out.core = T.core;
out.faces = faces;
out.dieTf = 'translate3d(' + f5(b.p[0]) + 'px,' + f5(b.p[1]) + 'px,' + f5(b.p[2]) + 'px) ' + m;
out.shLeft = (b.p[0] - 48) + 'px';
out.shTop = (b.p[1] - 48) + 'px';
out.shOpacity = Math.round(100 / (1 + z / 70)) / 100;
out.shScale = Math.round((1 + z / 220) * 100) / 100;
out.landed = this.phase === 'landed';
out.notLanded = this.phase !== 'landed';
out.flying = this.phase === 'fly';
out.resultName = this.face >= 0 ? T.names[this.face] : '';
out.avanti = this.props.avanti ?? 'T-Narratore.dc.html';
out.down = (e) => this.down(e);
out.move = (e) => this.move(e);
out.up = () => this.up();
out.autoThrow = () => {
if (this.phase === 'fly') return;
this.b.p = [150, 330, 100];
this.launch([(Math.random() - 0.5) * 900, -1300 - Math.random() * 700, 350]);
};
return out;
}
}
